<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Acesso - Dashboard Lifecycle BR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --nimbus-primary-interactive: #0059d5;
            --nimbus-primary-interactive-hover: #00429f;
            --nimbus-neutral-background: #0a0a0a;
            --nimbus-neutral-surface: #141414;
            --nimbus-neutral-surface-highlight: #1f1f1f;
            --nimbus-neutral-text-low: #888888;
            --nimbus-neutral-text-high: #f6f6f6;
            --success-text: #7af7c7;
            --danger-text: #f77a7c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: var(--nimbus-neutral-background);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--nimbus-neutral-text-high);
            padding: 24px;
        }
        .login-card {
            background: var(--nimbus-neutral-surface);
            border: 1px solid var(--nimbus-neutral-surface-highlight);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        .login-card h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--nimbus-neutral-text-high);
        }
        .login-card p {
            color: var(--nimbus-neutral-text-low);
            font-size: 0.875rem;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--nimbus-neutral-text-low);
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            border: 1px solid var(--nimbus-neutral-surface-highlight);
            border-radius: 8px;
            background: var(--nimbus-neutral-background);
            color: var(--nimbus-neutral-text-high);
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--nimbus-primary-interactive);
        }
        .form-group input::placeholder {
            color: var(--nimbus-neutral-text-low);
            opacity: 0.7;
        }
        .error-msg {
            font-size: 0.8125rem;
            color: var(--danger-text);
            margin-top: 8px;
            display: none;
        }
        .error-msg.visible { display: block; }
        .btn {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(90deg, var(--nimbus-primary-interactive) 0%, #00347d 100%);
            color: #fff;
            margin-top: 8px;
        }
        .btn:hover {
            background: var(--nimbus-primary-interactive-hover);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Dashboard Impacto - Lifecycle BR</h1>
        <p>Conteúdo restrito. Informe a senha para acessar.</p>
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Digite a senha" required autocomplete="off">
                <div class="error-msg" id="errorMsg">Senha incorreta. Tente novamente.</div>
            </div>
            <button type="submit" class="btn" id="submitBtn">Entrar</button>
        </form>
    </div>
    <script>
        (function() {
            // Hash SHA-256 da senha (substitua por outro hash para trocar a senha).
            // Para gerar: no terminal: echo -n "SuaSenha" | shasum -a 256
            var EXPECTED_HASH = '0807373145eebc2e052b6494af0ed2d230d5122b2efb7dacef5cc9e368c55a74';

            function toHex(buffer) {
                return Array.from(new Uint8Array(buffer))
                    .map(function(b) { return b.toString(16).padStart(2, '0'); })
                    .join('');
            }

            function hashPassword(str) {
                return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
                    .then(toHex);
            }

            var form = document.getElementById('loginForm');
            var input = document.getElementById('password');
            var errorMsg = document.getElementById('errorMsg');
            var submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                errorMsg.classList.remove('visible');
                submitBtn.disabled = true;

                var password = (input.value || '').trim();
                hashPassword(password).then(function(hash) {
                    if (hash === EXPECTED_HASH) {
                        sessionStorage.setItem('dashlcy_auth', '1');
                        var path = location.pathname.replace(/\/?index\.html$/, '') || '/';
                        location.replace(path + (path.slice(-1) === '/' ? '' : '/') + 'dashboard.html');
                    } else {
                        errorMsg.classList.add('visible');
                        input.focus();
                        input.value = '';
                    }
                }).catch(function() {
                    errorMsg.textContent = 'Erro ao verificar. Tente novamente.';
                    errorMsg.classList.add('visible');
                }).finally(function() {
                    submitBtn.disabled = false;
                });
            });
        })();
    </script>
</body>
</html>
